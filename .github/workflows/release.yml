name: Release

# A v<versionName> tag builds, signs and attests the APK and publishes a GitHub release.
# A manual run stops before the release. See docs/RELEASING.md

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and attest APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # Sigstore signing for the attestation
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      SIFT_KEY_ALIAS: sift
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ -z "$version" ]; then
            echo "::error::No versionName in app/build.gradle.kts"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25   # toolchainVersion in gradle/gradle-daemon-jvm.properties

      # Validates the wrapper jar. No cache, so a release never builds from cached outputs
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIFT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret SIFT_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "SIFT_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SIFT_KEYSTORE_PASSWORD: ${{ secrets.SIFT_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      # The Gradle build falls back to the debug key, so make sure the production key signed it
      - name: Check signing certificate
        env:
          EXPECTED_CERT: ${{ vars.SIFT_CERT_SHA256 }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          certs=$("$build_tools/apksigner" verify --print-certs "$apk")
          echo "$certs"
          # apksigner 37 prints "V2 Signer: certificate ...", older versions "Signer #1 certificate ..."
          digests=$(echo "$certs" | sed -n 's/^.*certificate SHA-256 digest: //p' | sort -u)
          expected=$(echo "$EXPECTED_CERT" | sed 's/^[[:space:]]*SHA256://' | tr -d ': \t' | tr 'A-F' 'a-f')
          if [ -z "$expected" ]; then
            echo "::error::Variable SIFT_CERT_SHA256 is not set"
            exit 1
          fi
          if [ "$digests" != "$expected" ]; then
            echo "::error::APK is not signed with the production key"
            exit 1
          fi

      - name: Name release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/sift-$VERSION.apk"
          cp app/build/outputs/mapping/release/mapping.txt "dist/sift-$VERSION-mapping.txt"
          cd dist
          sha256sum "sift-$VERSION.apk" > "sift-$VERSION.apk.sha256"

      # Verify a download with: gh attestation verify sift-<version>.apk -R nikableh/sift
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/sift-${{ steps.version.outputs.version }}.apk

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          name: release
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          CERT: ${{ vars.SIFT_CERT_SHA256 }}
        run: |
          prerelease=
          case "$VERSION" in *-*) prerelease=--prerelease ;; esac
          notes=$(cat <<EOF
          Download \`sift-$VERSION.apk\` and open it on your phone to install. Sift needs Android 11 or newer

          To check that the APK is genuine, compare its signing certificate with this SHA-256 fingerprint, for example in AppVerifier or with \`apksigner verify --print-certs\`
          \`\`\`
          $CERT
          \`\`\`
          To check that this repository's workflow built it from the tagged source, run
          \`\`\`
          gh attestation verify sift-$VERSION.apk -R $GITHUB_REPOSITORY
          \`\`\`
          EOF
          )
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Sift $VERSION" \
            --notes "$notes" \
            --generate-notes \
            $prerelease
